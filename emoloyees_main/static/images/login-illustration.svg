<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background circle -->
  <circle cx="200" cy="150" r="130" fill="#EBF3FE"/>

  <!-- Monitor -->
  <rect x="120" y="70" width="160" height="110" rx="8" fill="#fff" stroke="#4a90e2" stroke-width="3"/>
  <rect x="130" y="80" width="140" height="85" rx="4" fill="#F0F6FF"/>
  <!-- Monitor stand -->
  <rect x="180" y="180" width="40" height="20" rx="2" fill="#4a90e2"/>
  <rect x="160" y="198" width="80" height="6" rx="3" fill="#4a90e2"/>

  <!-- Lock icon on screen -->
  <rect x="182" y="110" width="36" height="30" rx="5" fill="#4a90e2"/>
  <path d="M192 110 V100 a8 8 0 0 1 16 0 V110" stroke="#4a90e2" stroke-width="3" fill="none"/>
  <circle cx="200" cy="122" r="4" fill="#fff"/>
  <rect x="198" y="125" width="4" height="8" rx="2" fill="#fff"/>

  <!-- Person silhouette (left) -->
  <circle cx="90" cy="130" r="18" fill="#5BA0F2"/>
  <path d="M65 190 Q65 160 90 155 Q115 160 115 190" fill="#5BA0F2"/>

  <!-- Person silhouette (right) -->
  <circle cx="310" cy="130" r="18" fill="#357ABD"/>
  <path d="M285 190 Q285 160 310 155 Q335 160 335 190" fill="#357ABD"/>

  <!-- Decorative dots -->
  <circle cx="80" cy="80" r="4" fill="#4a90e2" opacity="0.3"/>
  <circle cx="330" cy="90" r="5" fill="#4a90e2" opacity="0.2"/>
  <circle cx="100" cy="230" r="3" fill="#4a90e2" opacity="0.25"/>
  <circle cx="300" cy="230" r="4" fill="#4a90e2" opacity="0.2"/>
  <circle cx="60" cy="170" r="3" fill="#4a90e2" opacity="0.15"/>
  <circle cx="340" cy="170" r="3" fill="#4a90e2" opacity="0.15"/>

  <!-- Key icon (floating bottom-left) -->
  <g transform="translate(110, 220) rotate(-30)">
    <circle cx="0" cy="0" r="8" stroke="#4a90e2" stroke-width="2.5" fill="none"/>
    <line x1="7" y1="0" x2="28" y2="0" stroke="#4a90e2" stroke-width="2.5"/>
    <line x1="24" y1="0" x2="24" y2="6" stroke="#4a90e2" stroke-width="2.5"/>
    <line x1="20" y1="0" x2="20" y2="5" stroke="#4a90e2" stroke-width="2.5"/>
  </g>

  <!-- Shield icon (floating top-right) -->
  <g transform="translate(290, 65)">
    <path d="M0-12 L12-6 L12 4 Q12 14 0 18 Q-12 14 -12 4 L-12-6 Z" fill="#4a90e2" opacity="0.2" stroke="#4a90e2" stroke-width="1.5"/>
    <polyline points="-4,4 -1,8 6,-2" stroke="#4a90e2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom text area -->
  <text x="200" y="265" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#4a90e2">Employee Directory</text>
  <text x="200" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#888">Secure Access Portal</text>
</svg>
